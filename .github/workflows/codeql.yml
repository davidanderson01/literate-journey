      name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 8 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "javascript-typescript"
            os: "ubuntu-latest"
            build-mode: "automatic"
          - language: "python"
            os: "ubuntu-latest"
            build-mode: "automatic"
          - language: "swift"
            os: "macos-latest"
            build-mode: "automatic"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js for JavaScript/TypeScript
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: +security-extended,security-and-quality

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        if [ "${{ matrix.language }}" == "swift" ]; then
          xcodebuild -scheme MyApp build
        elif [ "${{ matrix.language }}" == "python" ]; then
          pip install -r requirements.txt
        else
          echo "Manual build commands are not configured for this language."
          exit 1
        fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
